[project]
name = "ida-colors"
version = "0.0.1"
description = "Parse IDA Pro color tags into a token tree for lightweight tokenization of IDA disassembly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Needed by the `ida-colors` CLI. The parser itself doesn't use IDA.
ida = ["idapro>=0.0.4"]

[project.scripts]
ida-colors = "ida_colors.__main__:cli"

[project.urls]
Homepage = "https://github.com/thebabush/ida-colors"
Repository = "https://github.com/thebabush/ida-colors"
Issues = "https://github.com/thebabush/ida-colors/issues"

[dependency-groups]
dev = [
    # Also ships the ida_* stubs ty uses. IDA-backed tests skip without an IDA install.
    "idapro>=0.0.4",
    "pytest>=8.4.2",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ANN stands in for mypy's `disallow_untyped_defs`, which ty has no equivalent for.
select = ["E", "F", "I", "W", "UP", "B", "C4", "PIE", "PGH", "ISC", "PERF", "RUF", "ANN"]
ignore = [
    "ANN401",  # explicit `Any` is allowed, as in mypy strict
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
quote-style = "single"

[tool.ty.rules]
# Roughly mypy's `strict`: turn on the checks ty leaves off by default.
division-by-zero = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pyright]
# Only for Pylance in editors. ty is the type checker that CI runs.
venvPath = "."
venv = ".venv"
# The ida_* stubs ship with idapro, but their .py sources only exist inside an IDA install.
reportMissingModuleSource = "none"
