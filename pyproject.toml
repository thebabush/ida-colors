[project]
name = "ida-colors"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "idapro>=0.0.4",
    "pytest>=8.4.2",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ANN stands in for mypy's `disallow_untyped_defs`, which ty has no equivalent for.
select = ["E", "F", "I", "W", "UP", "B", "C4", "PIE", "PGH", "ISC", "PERF", "RUF", "ANN"]
ignore = [
    "ANN401",  # explicit `Any` is allowed, as in mypy strict
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
quote-style = "single"

[tool.ty.rules]
# Roughly mypy's `strict`: turn on the checks ty leaves off by default.
division-by-zero = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
pythonpath = ["."]
